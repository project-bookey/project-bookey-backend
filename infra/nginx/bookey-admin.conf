server {
    listen 80;
    listen [::]:80;
    server_name admin.bookey.site;
    return 301 https://admin.bookey.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.bookey.site;

    ssl_certificate /etc/letsencrypt/live/admin.bookey.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bookey.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
