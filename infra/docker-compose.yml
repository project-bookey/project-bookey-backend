name: bookey

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookey-postgres
    environment:
      POSTGRES_DB: bookey
      POSTGRES_USER: bookey
      POSTGRES_PASSWORD: bookey_local
      TZ: Asia/Seoul
    ports:
      - "55432:5432"
    volumes:
      - bookey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookey -d bookey"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bookey-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - bookey-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bookey-pgdata:
  bookey-redisdata:
