name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bookey-production-deploy
  cancel-in-progress: false

env:
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/bookey' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        working-directory: server
        run: ./mvnw -B test

  deploy:
    needs: validate
    runs-on: [self-hosted, bookey-prod]
    env:
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
      GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
      YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='server/target' \
            --exclude='target' \
            -czf "/tmp/bookey-backend-${GITHUB_RUN_ID}.tgz" .

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${EC2_APP_DIR:-/opt/bookey}"
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKUP_DIR="${APP_DIR}/backups/${RELEASE_ID}"

          required_secrets=(
            KAKAO_REST_KEY ALADIN_TTB_KEY GOOGLE_BOOKS_KEY YES24_API_KEY
            SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD MAIL_FROM
          )
          for key in "${required_secrets[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${key}" >&2
              exit 1
            fi
          done

          sudo mkdir -p "${BACKUP_DIR}"

          DB_USER=$(docker exec bookey-postgres-1 printenv POSTGRES_USER)
          DB_NAME=$(docker exec bookey-postgres-1 printenv POSTGRES_DB)
          docker exec bookey-postgres-1 pg_dump -U "${DB_USER}" "${DB_NAME}" \
            | sudo tee "${BACKUP_DIR}/database.sql" >/dev/null

          OLD_IMAGE=$(docker inspect bookey-backend-1 --format '{{.Image}}')
          docker tag "${OLD_IMAGE}" "bookey-backend:rollback-${RELEASE_ID}"

          sudo mv "${APP_DIR}/project-bookey-backend" "${BACKUP_DIR}/source"
          sudo mkdir "${APP_DIR}/project-bookey-backend"
          sudo tar -xzf "/tmp/bookey-backend-${GITHUB_RUN_ID}.tgz" \
            -C "${APP_DIR}/project-bookey-backend"
          sudo chown -R ec2-user:ec2-user "${APP_DIR}/project-bookey-backend"

          # GitHub가 관리하는 외부 연동 Secret만 서버 .env에 갱신한다.
          # DB/JWT/S3 등 EC2 로컬 설정은 기존 값을 보존한다.
          update_env() {
            local key="$1"
            local value="$2"
            local env_file="${APP_DIR}/.env"
            local temp_file
            temp_file=$(mktemp)
            sudo awk -v key="${key}" 'index($0, key "=") != 1' "${env_file}" > "${temp_file}"
            printf '%s=%s\n' "${key}" "${value}" >> "${temp_file}"
            sudo install -m 600 "${temp_file}" "${env_file}"
            rm -f "${temp_file}"
          }

          for key in "${required_secrets[@]}"; do
            update_env "${key}" "${!key}"
          done

          # EC2 운영 Compose도 저장소를 단일 원천으로 사용한다.
          sudo install -m 644 \
            "${APP_DIR}/project-bookey-backend/infra/docker-compose.ec2.yml" \
            "${APP_DIR}/docker-compose.yml"

          cd "${APP_DIR}"
          docker compose build backend
          docker compose up -d --no-deps backend

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health; then
              echo
              exit 0
            fi
            sleep 5
          done

          docker compose logs --tail=160 backend
          exit 1

      - name: Health check
        run: curl --fail --retry 12 --retry-delay 5 "https://api.bookey.site/actuator/health"

      - name: Remove release archive
        if: always()
        run: rm -f "/tmp/bookey-backend-${GITHUB_RUN_ID}.tgz"
