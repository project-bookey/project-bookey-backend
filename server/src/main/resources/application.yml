spring:
  application:
    name: bookey-server
  profiles:
    default: local
  jackson:
    # Jackson 3 는 날짜를 기본적으로 ISO-8601 로 직렬화한다.
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/bookey}
    username: ${DB_USER:bookey}
    password: ${DB_PASSWORD:bookey_local}
    hikari:
      maximum-pool-size: 15
      pool-name: bookey-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
  servlet:
    multipart:
      max-file-size: 10MB       # bookey.storage.image.max-bytes 와 맞춘다
      max-request-size: 12MB
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
  tomcat:
    # max-request-size 를 넘긴 요청의 남은 본문까지 전부 읽어 버려야 413 응답이 클라이언트에 도달한다.
    max-swallow-size: 32MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /openapi.json

bookey:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-32bytes-or-more}
    access-token-ttl: PT1H
    refresh-token-ttl: P30D
    admin-token-ttl: PT30M
  auth:
    signup-verification: ${SIGNUP_VERIFICATION:IDENTITY}   # EMAIL_CODE | IDENTITY(휴대폰 본인인증) | NONE(인증 생략)
    identity:
      portone-api-secret: ${PORTONE_API_SECRET:}     # 포트원 V2 API Secret — 계약 후 발급
      portone-store-id: ${PORTONE_STORE_ID:}
      portone-channel-key: ${PORTONE_CHANNEL_KEY:}   # 본인인증 채널(NICE/KCB 등) 키
      allow-dev-stub: ${IDENTITY_DEV_STUB:true}      # secret 없이 "dev-" id 통과(로컬 전용). 운영은 prod 프로필이 끈다
    email-code:
      ttl: PT3M            # 코드를 입력·확인할 수 있는 시간 — 앱이 발급 응답의 expiresInSec 으로 남은 시간을 센다
      hourly-limit: 10     # 같은 이메일·용도로 1시간에 받을 수 있는 코드 수 — 다시 받기는 기다림 없이 열어 두고 남용(메일 폭탄·코드 바꿔 가며 대입)만 막는다
      verified-ttl: PT30M  # 가입 폼에서 확인을 마친 코드는 이만큼 더 쓸 수 있다 — 약관을 읽는 사이 3분이 지나도 가입이 막히지 않게
      max-attempts: 5
      expose: ${AUTH_EMAIL_CODE_EXPOSE:true}   # 코드 발급 응답에 코드 동봉(로컬 개발·스모크 편의). 운영은 application-prod.yml 이 끈다
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@bookey.local}
    from-name: ${MAIL_FROM_NAME:Bookey}
    subject-prefix: ${MAIL_SUBJECT_PREFIX:[Bookey]}
  book-api:
    kakao-key: ${KAKAO_REST_KEY:}
    aladin-ttb-key: ${ALADIN_TTB_KEY:}
    google-books-key: ${GOOGLE_BOOKS_KEY:}
    yes24-key: ${YES24_API_KEY:}            # 예스24 오픈API (X-Api-Key) — 없으면 YES24 경로 전체 건너뜀
    cache-ttl: PT24H
    yes24-curation-ttl: PT1H
    juso-key: ${JUSO_API_KEY:}              # 도로명주소 검색 API(business.juso.go.kr) — 모임 장소 주소 자동완성. 없으면 카카오 주소 검색만
  oauth:
    google-client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
    apple-audiences: ${APPLE_OAUTH_AUDIENCES:app.bookey.mobile}
    kakao-app-id: ${KAKAO_APP_ID:}
  club:
    max-member-limit: 50                  # 책갈피로 늘릴 수 있는 상한 (clubs.member_limit CHECK 상한과 같다)
    free-member-limit: 10                 # 무료 정원 (호스트 포함) — 새 클럽은 늘 이 정원으로 연다
    seat-step: 10                         # 자리는 이 단위로만 늘린다 — 정원이 20 · 30 · 40 · 50
    seat-cost-bookmarks: 2                # 자리 1개당 책갈피 — 10자리 한 번에 20개
    nudge-cooldown: PT24H
    nudge-daily-limit: 3
    join-code-lookup-rate-limit: 10        # 분당
  notification:
    daily-cap: 2
    weekly-cap: 7
    club-daily-cap: 3
    default-send-hour: 20
    expo-push-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    expo-receipt-url: ${EXPO_RECEIPT_URL:https://exp.host/--/api/v2/push/getReceipts}
    # Expo Push Security를 켠 경우에만 설정. 비워 두면 일반 Expo Push API로 발송한다.
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  social:
    postcard-daily-free: 5              # 무료 엽서 일 5장 — KST 자정 리셋 (§14.9 확정)
    postcard-max-length: 16             # 16글자 (grapheme)
    postcard-cost-bookmarks: 1          # 엽서 1장 = 책갈피 1
    stamp-cost-bookmarks: 2             # 우표 1개 = 책갈피 2
    bookmark-price-krw: 200             # 책갈피 1개 단건 구매가
    subscription-monthly-postcards: 50  # 구독 월 지급 엽서
    subscription-monthly-stamps: 30     # 구독 월 지급 우표
    subscription-price-krw: 5900        # 월 구독가 — 스토어 상품 구성 시 기준
  payment:
    subscription-product-id: ${SUBSCRIPTION_PRODUCT_ID:bookey.plus.monthly}
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      success-url: ${TOSS_SUCCESS_URL:}
      fail-url: ${TOSS_FAIL_URL:}
      app-scheme: ${TOSS_APP_SCHEME:bookey}
    apple:
      issuer-id: ${APPSTORE_ISSUER_ID:}
      key-id: ${APPSTORE_KEY_ID:}
      bundle-id: ${APPSTORE_BUNDLE_ID:app.bookey.mobile}
      private-key: ${APPSTORE_PRIVATE_KEY:}
      environment: ${APPSTORE_ENVIRONMENT:SANDBOX} # SANDBOX | PRODUCTION
    google:
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:app.bookey.mobile}
      service-account-email: ${GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL:}
      private-key: ${GOOGLE_PLAY_PRIVATE_KEY:}
      # Pub/Sub push URL을 /api/v1/webhooks/google?token=<값> 으로 등록한다.
      rtdn-token: ${GOOGLE_PLAY_RTDN_TOKEN:}
  storage:
    type: ${STORAGE_TYPE:local}                    # local | gcs | s3 | none(업로드 끔). prod 기본값은 application-prod.yml 에서 none
    local:
      dir: ${STORAGE_LOCAL_DIR:./uploads}          # npm run dev 는 server/ 에서 기동 → server/uploads
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:} # origin 만(예: http://192.168.0.10:8098). 비우면 요청 origin
    gcs:
      bucket: ${GCS_BUCKET:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
    image:
      max-bytes: 10485760                          # 10MB
      max-per-post: 10

logging:
  level:
    app.bookey: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
