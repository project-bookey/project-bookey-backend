# 입력 검증 기본 문구 — Hibernate Validator 기본값(로케일 따라 영어 또는 딱딱한 한국어)을 앱 말투로 덮는다.
# 앱은 errors[].reason 을 그대로 보여 준다(src/api/client.ts). Java 9+ ResourceBundle 은 UTF-8 로 읽는다.
jakarta.validation.constraints.NotBlank.message=빈칸을 채워 주세요.
jakarta.validation.constraints.NotNull.message=빈칸을 채워 주세요.
jakarta.validation.constraints.NotEmpty.message=빈칸을 채워 주세요.
# 글자 수 상한. 최소 길이가 있거나(코드·비밀번호) 목록에 거는 @Size 는 그 자리에서 message 를 따로 준다.
jakarta.validation.constraints.Size.message={max}자까지 적을 수 있어요.
jakarta.validation.constraints.Min.message={value} 이상으로 적어 주세요.
jakarta.validation.constraints.Max.message={value} 이하로 적어 주세요.
jakarta.validation.constraints.DecimalMin.message={value} 이상으로 적어 주세요.
jakarta.validation.constraints.DecimalMax.message={value} 이하로 적어 주세요.
jakarta.validation.constraints.Email.message=이메일 주소를 다시 확인해 주세요.
jakarta.validation.constraints.Pattern.message=입력한 값을 다시 확인해 주세요.
